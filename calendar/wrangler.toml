name = "sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Protocol-first layout: caldav/… now, webdav/… and carddav/… later (docs/specs/sync.md §6).
[[r2_buckets]]
binding = "STORE"
bucket_name = "sync"

[vars]
CALDAV_USER = "chau"
CALDAV_DEFAULT_NAME = "Calendar"

# Secret (wrangler secret put): CALDAV_PASS_HASH = sha256 hex of the app password, set by sync/bin/caldav-passwd.sh. It is the bootstrap hash only: the first correct login stores a salted PBKDF2 record in R2 (caldav/auth/), BUG-30. Failed logins: 10 per 15 min per IP.
