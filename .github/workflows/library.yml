name: library
# Gallery (library/) deploys on every push to main that touches it. strip/, sync/, calendar/ and docs/ never deploy here.
on:
  push:
    branches: [main]
    paths: [library/**, .github/workflows/library.yml]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: library/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      # test/feed.test.mjs validates the podcast feed with xmllint, which the runner image lacks.
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GALLERY_GITHUB }}
