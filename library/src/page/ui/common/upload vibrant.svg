<svg width="150" height="60" viewBox="0 0 150 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define the soft blue glow effect -->
    <filter id="blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.7"/> <!-- Adjust opacity of glow -->
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Button Background -->
  <rect x="15" y="10" width="120" height="40" rx="20" fill="#0084ff" filter="url(#blue-glow)" />

  <!-- Button Text -->
  <text x="75" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Upload</text>
</svg>
