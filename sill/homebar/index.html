<!doctype html>
<!-- Recense's host for Gallery's home bar (SPEC P2). homebar.js and homebar.css are Gallery's own
     (../gallery/gallery/src/client), copied in by build.sh: the bar is one implementation, never a copy to
     edit here. This page only places it in the window and passes messages to and from main.swift. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="homebar.css">
<style>
  /* the page is see-through: the subtitles are drawn under it, and it only takes the pointer where the bar is */
  :root{
    --blue:#0a84ff;
    --bb0:0px;   /* nothing sits under the bar in Recense's window */
    --cl:24px    /* the control line (HomeBar.line) */
  }
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:transparent;
    color:#fff;
    font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-user-select:none;
    user-select:none;
    -webkit-font-smoothing:antialiased
  }
  body{position:relative}
  button{font:inherit;background:none;border:0;padding:0;margin:0;color:inherit;cursor:default}

  /* the vertical bar at the right edge, crossing the same control line as the stroke (as Gallery's .p-ctrl),
     scaled to the window: its ruler and list are never taller than the window allows */
  .p-ctrl{
    position:absolute;
    right:12px;
    bottom:calc(var(--bb0) + var(--cl) - 32px);
    --sph:min(180px,calc(100vh - 56px))
  }

  /* while playing, both bars fade after a moment, as Gallery's chrome does; any movement brings them back */
  .p-hb,.p-ctrl{transition:opacity .3s}
  body.rest .p-hb:not([data-open="true"]),
  body.rest .p-ctrl{opacity:0}
</style>
</head>
<body>
<div class="p-ctrl"><div class="p-eqwrap" id="vw"></div></div>
<script src="homebar.js"></script>
<script>
(() => {
  "use strict";
  const post = (m) => {
    try {
      webkit.messageHandlers.recense.postMessage(m);
    } catch (e) {}
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // the player as main.swift last reported it; time runs on between reports
  const st = { time: 0, at: performance.now(), duration: 0, paused: true, rate: 1, lang: "en", size: 1, sizeMin: 0.7, sizeMax: 1.6, prominence: null, bookmarks: [] };
  const now = () => (st.paused ? st.time : st.time + ((performance.now() - st.at) / 1000) * st.rate);
  let lastLoop = ""; // the loop state Recense has, so the bar never echoes it back
  let live = false; // nothing is sent until the first report (the bar's own first paint is not a command)

  let restT = 0;
  const wake = () => {
    document.body.classList.remove("rest");
    clearTimeout(restT);
    if (!st.paused && !(bar && (bar.open || bar.busy))) restT = setTimeout(() => document.body.classList.add("rest"), 2500);
  };

  let bar = null;
  const I = Homebar.ICONS;

  bar = Homebar.horizontal({
    time: now,
    duration: () => st.duration,
    paused: () => st.paused,
    seek: (t) => {
      st.time = t;
      st.at = performance.now();
      post({ k: "cmd", c: "seek", t });
    },
    toggle: () => post({ k: "cmd", c: "playPause" }),
    skip: (d) => post({ k: "cmd", c: "skip", d }),
    setRate: (v) => {
      if (live) post({ k: "cmd", c: "speed", v });
      return v;
    },
    setLoop: (l) => {
      const j = JSON.stringify({ track: l.track, ab: l.ab, a: l.a, b: l.b });
      if (!live || j === lastLoop) return;
      lastLoop = j;
      post({ k: "cmd", c: "loop", track: l.track, ab: l.ab, a: l.a, b: l.b });
    },
    scrub: (on) => post({ k: "cmd", c: "scrub", on }),
    say: (t) => post({ k: "say", t }),
    wake,
    onOpen: (on) => {
      post({ k: "open", on });
      hits();
    },
    lang: {
      get: () => st.lang,
      set: (v) => {
        st.lang = v;
        post({ k: "lang", v });
      },
    },
    size: {
      get: () => st.size,
      set: (v) => {
        st.size = Math.round(clamp(v, st.sizeMin, st.sizeMax) * 20) / 20;
        post({ k: "size", v: st.size });
      },
      get min() {
        return st.sizeMin;
      },
      get max() {
        return st.sizeMax;
      },
      step: 0.1,
    },
    onSize: () => vbar.paint(),
    // hover: the bookmarks; a firm press on the stroke: bookmark this moment
    hover: "bookmarks",
    bookmarks: () => st.bookmarks,
    jump: (t) => post({ k: "jump", t }),
    addBookmark: () => post({ k: "bookmark" }),
    firmPress: () => post({ k: "bookmark" }),
    // slide 1 language · 2 text size · 3 Loop · A · B · 4 the speed ruler · 5 Download · Retranscribe ·
    // Export as MD and M4B (four things: the two exports fold onto each other in the right third)
    slides: () => [
      "lang",
      "size",
      "loop",
      "speed",
      {
        id: "tools",
        label: "Download, retranscribe and export",
        items: [
          { label: "Download the played audio", text: "Download", icon: I.download, cls: "p-stack", act: () => post({ k: "download" }) },
          { label: "Retranscribe and retranslate", text: "Retranscribe", icon: I.retranscribe, cls: "p-stack", act: () => post({ k: "retranscribe", lang: st.lang }) },
          {
            label: "Export",
            text: "MD · M4B",
            fold: [
              { label: "Export as Markdown", text: "Export as MD", icon: I.markdown, cls: "p-stack", act: () => post({ k: "export", as: "md" }) },
              { label: "Export as an audiobook", text: "M4B", icon: I.book, cls: "p-stack", act: () => post({ k: "export", as: "m4b" }) },
            ],
          },
        ],
      },
    ],
  });
  document.body.appendChild(bar.el);

  // the vertical bar: no EQ here, so it is the prominence, the bookmarks on hover, and a press to reset
  const vbar = Homebar.vertical({
    prominence: {
      get: () => st.prominence,
      set: (p) => {
        st.prominence = p;
        const m = Homebar.prominence(p);
        post({ k: "prominence", v: p, a1: m ? m.orig : null, a2: m ? m.trail : null });
      },
    },
    shaped: () => Math.abs(st.size - 1) > 1e-6 || st.prominence != null,
    press: (shaped) => {
      if (!shaped) return;
      if (Math.abs(st.size - 1) > 1e-6) {
        st.size = 1;
        post({ k: "size", v: 1 });
        bar.paintSize();
      }
      if (st.prominence != null) {
        st.prominence = null;
        post({ k: "prominence", v: null, a1: null, a2: null });
      }
      post({ k: "say", t: "Reset" });
    },
    wake,
    list: () => st.bookmarks.map((b) => ({ label: b.note || "Bookmark", sub: Homebar.dur(b.t), act: () => post({ k: "jump", t: b.t }) })),
    listAt: (items) => {
      // the bookmark nearest the playhead in front
      let best = 0;
      st.bookmarks.forEach((b, i) => {
        if (Math.abs(b.t - now()) < Math.abs(st.bookmarks[best].t - now())) best = i;
      });
      return best;
    },
    listLabel: "Bookmarks",
    listEmpty: "No bookmarks yet",
  });
  document.getElementById("vw").appendChild(vbar.el);
  vbar.paint();

  // ----- where the page takes the pointer: posted to main.swift, which passes everything else through -----
  let sentHits = "";
  const hits = () => {
    const r = [];
    const add = (el, grow = [0, 0, 0, 0]) => {
      if (!el) return;
      const b = el.getBoundingClientRect();
      if (!b.width || !b.height) return;
      r.push([b.left - grow[3], b.top - grow[0], b.width + grow[1] + grow[3], b.height + grow[0] + grow[2]].map((x) => Math.round(x)));
    };
    add(bar.el.querySelector(".p-hbbox"));
    if (bar.open) {
      add(bar.el.querySelector(".p-hbbarrel"));
      add(bar.el.querySelector(".p-hbseek"));
      add(bar.el.querySelector(".p-hbval"));
    }
    add(vbar.btn, [100, 16, 8, 30]); // the stroke's own hit area (.p-eqbtn::before)
    const list = vbar.el.querySelector(".p-vlist.on");
    add(list);
    const j = JSON.stringify(r);
    if (j !== sentHits) {
      sentHits = j;
      post({ k: "hits", r });
    }
  };
  setInterval(hits, 250);
  addEventListener("resize", hits);
  addEventListener("pointermove", () => {
    wake();
    hits();
  });

  // ----- what main.swift says -----
  window.Recense = {
    report: (r) => {
      const was = st.paused;
      st.time = r.time;
      st.at = performance.now();
      st.duration = r.duration;
      st.paused = r.paused;
      st.rate = r.rate;
      lastLoop = JSON.stringify({ track: !!r.loop.track, ab: !!r.loop.ab, a: r.loop.a, b: r.loop.b });
      live = true;
      bar.report({ rate: r.rate, loop: r.loop });
      if (was !== st.paused) wake();
    },
    state: (s) => {
      Object.assign(st, s);
      bar.paint();
      bar.paintSize();
      vbar.paint();
    },
    key: (k) => {
      if (k === "a") bar.captureA();
      else if (k === "b") bar.captureB();
      else if (k === "l") bar.pressLoop();
      else if (k === "<") bar.speedStep(-1);
      else if (k === ">") bar.speedStep(1);
      wake();
    },
    close: () => bar.close(),
    wake,
  };

  hits();
  post({ k: "ready" });
})();
</script>
</body>
</html>
